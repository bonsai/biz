name: Build episode video

on:
  workflow_dispatch:
    inputs:
      episode:
        description: "Episode number (1-31)"
        required: true
        default: "1"
        type: string
      speaker:
        description: "VOICEVOX speaker/style ID"
        required: true
        default: "3"
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools and Japanese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          python -m pip install --upgrade pip
          python -m pip install requests

      - name: Start VOICEVOX Engine
        run: |
          docker run -d --name voicevox -p 50021:50021 voicevox/voicevox_engine:cpu-ubuntu20.04-latest
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:50021/version >/dev/null; then
              echo "VOICEVOX is ready"
              exit 0
            fi
            sleep 2
          done
          docker logs voicevox
          exit 1

      - name: Build audio, subtitles and video
        env:
          EPISODE: ${{ inputs.episode }}
          VOICEVOX_SPEAKER: ${{ inputs.speaker }}
          VOICEVOX_URL: http://127.0.0.1:50021
        run: python scripts/build_episode_video.py

      - name: Upload MP4 and production assets
        uses: actions/upload-artifact@v4
        with:
          name: episode-${{ inputs.episode }}-video
          path: |
            dist/episode-*.mp4
            dist/episode-*.wav
            dist/episode-*.srt
          if-no-files-found: error
          retention-days: 14
